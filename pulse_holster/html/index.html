<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
    // Spielt die Holster-Sounds ab: { action = 'play', file = 'holster.ogg', volume = 0.35 }
    var cache = {};
    window.addEventListener('message', function (e) {
        var d = e.data || {};
        if (d.action !== 'play' || !d.file) return;
        var base = cache[d.file] || (cache[d.file] = new Audio('sounds/' + d.file));
        var a = base.cloneNode();
        a.volume = Math.max(0, Math.min(1, Number(d.volume) || 0));
        a.play().catch(function () {});
    });
</script>
</body>
</html>
